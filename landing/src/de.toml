problem_kicker = "Das Problem"
problem_title = "Beim Lesen wirkt alles klar. Eine Woche später ist vieles weg."
problem_lead = "Das ist normal und kein Zeichen mangelnden Fleißes. Gängige Lernroutinen helfen dagegen wenig."
problem_1_h = "Vergessen geht schnell"
problem_1_p = "Hermann Ebbinghaus hat es 1885 gemessen: Das meiste Neue ist nach wenigen Tagen nicht mehr abrufbar. Dieser Verlauf, die Vergessenskurve, ist seitdem vielfach bestätigt."
problem_2_h = "Wiederlesen täuscht"
problem_2_p = "Wer einen Text zum zweiten Mal liest, erkennt ihn wieder und hält das für Wissen. In einer großen Übersichtsstudie schneiden zwei andere Methoden am besten ab: sich selbst abfragen und über Wochen verteilt lernen."
problem_3_h = "Karteikarten brauchen Disziplin"
problem_3_p = "Karteikarten-Apps wie Anki fragen ab und verteilen die Wiederholung über Wochen. Dafür muss man aber eigene Karten schreiben und jeden Tag daran denken. Das halten viele nicht lange durch."

idea_kicker = "Die Idee"
idea_title = "Die Fragen stehen im Text und kommen später wieder."
idea_lead = "Die Forscher Andy Matuschak und Michael Nielsen nennen Texte mit eingebetteten Wiederholungsfragen <em lang=\"en\">mnemonic medium</em>, sinngemäß: ein Text, der beim Erinnern hilft. Erprobt haben sie das Prinzip 2019 mit <a href=\"https://quantum.country/\">Quantum Country</a>, einer frei zugänglichen Einführung in Quantencomputing, in die Wiederholungsfragen eingebettet sind."
idea_1_h = "Die Lehrenden schreiben die Fragen."
idea_1_p = "Sie müssen keine Karteikarten anlegen."
idea_2_h = "Die Fragen stehen beim Stoff."
idea_2_p = "Direkt nach dem Abschnitt, den Sie gerade gelesen haben, prüfen Sie sich selbst. Das kostet ein paar Sekunden."
idea_3_h = "Die Wiederholung kommt zu Ihnen."
idea_3_p = "Statt selbst an Termine zu denken, bekommen Sie die Fragen per E-Mail, in immer größeren Abständen."
idea_pulse = "psi-pulse bringt dieses Prinzip in die Lehre des Lehrstuhls PSI: in seine Skripte und Vorlesungsseiten, mit Erinnerungen per E-Mail statt einer eigenen App."
idea_quote = "As a medium, books have no direct means of communicating with readers over time."
idea_quote_translation = "<p class=\"quote-translation\">„Als Medium haben Bücher keine direkte Möglichkeit, über die Zeit hinweg mit ihren Lesern zu kommunizieren.“</p>"
idea_quote_source = "Andy Matuschak, Michael Nielsen: <a href=\"https://numinous.productions/timeful/\"><cite lang=\"en\">Timeful Texts</cite></a> (2020)"

how_kicker = "So funktioniert’s"
how_title = "Drei Schritte, kein Passwort"
how_1_h = "Lesen und sich selbst testen"
how_1_p = "Im Skript stehen Selbsttests. Sie überlegen, decken die Antwort auf und geben ehrlich an, ob Sie sie gewusst haben. Ohne Anmeldung bleiben Ihre Antworten nur in Ihrem Browser gespeichert."
how_2_h = "Per E-Mail wiederholen"
how_2_p = "Unter einer beantworteten Frage wählen Sie „Dauerhaft sichern und per Mail wiederholen“, geben Ihre Adresse ein und tippen den sechsstelligen Code aus der Mail ab. Ihre bisherigen Antworten werden übernommen."
how_3_h = "Die Fragen kommen wieder"
how_3_p = "Der Abstand wächst mit jeder gewussten Antwort: 1, 2, 4, 7, dann 14 Tage. Wussten Sie eine Antwort nicht, kommt die Frage früher. Höchstens eine Mail am Tag mit bis zu sechs Fragen, mittwochs eine Auswahl."
how_fineprint = "Über den Link in der Mail antworten Sie direkt, ohne Anmeldung. Reagieren Sie eine Weile nicht, pausieren die Mails zwei Wochen. Abbestellen können Sie über den Link in jeder Mail. Ihre Antworten fließen nicht in Noten ein."

try_kicker = "Ausprobieren"
try_title = "Eine echte psi-pulse-Frage, passend zu dieser Seite"
try_lead = "So sehen die Selbsttests in den Skripten aus. Überlegen Sie kurz, decken Sie dann die Antwort auf."
try_note = "Solange Sie sich nicht anmelden, wird nichts an den psi-pulse-Server übertragen. Ihre Antworten bleiben in diesem Browser. Wenn Sie sich anmelden, kommen auch diese drei Fragen per Mail wieder."
demo_q1 = "In welchen Abständen kommt eine Frage wieder, wenn Sie die Antwort jedes Mal wissen?"
demo_a1 = "Im Abstand von 1, 2, 4, 7 und 14 Tagen. Wissen Sie die Antwort nicht, kommt die Frage früher wieder."
demo_q2 = "Was hilft beim Behalten mehr: den Text noch einmal lesen oder sich selbst abfragen?"
demo_a2 = "Sich selbst abfragen. Was man aus dem Gedächtnis abruft, behält man länger als das, was man nur noch einmal liest (Testeffekt, Roediger und Karpicke 2006)."
demo_q3 = "Wie nennen Andy Matuschak und Michael Nielsen Texte mit eingebetteten Wiederholungsfragen?"
demo_a3 = "<span lang=\"en\">Mnemonic medium</span>. Ihr Beispiel ist <span lang=\"en\">Quantum Country</span>, eine Einführung in Quantencomputing."

privacy_kicker = "Datenschutz"
privacy_title = "Nur die Daten, die für die Erinnerung nötig sind"
privacy_lead = "Was psi-pulse speichert, hängt davon ab, ob Sie sich anmelden."
privacy_1_h = "Ohne Anmeldung: nichts"
privacy_1_p = "Ihre Antworten bleiben im Speicher Ihres Browsers und werden nicht an uns übertragen. Löschen können Sie sie dort jederzeit selbst."
privacy_2_h = "Mit Anmeldung: das Nötigste"
privacy_2_p = "Ihre E-Mail-Adresse, auf Wunsch ein Name, Ihre Fragen und ob Sie die Antworten wussten. Keine Passwörter, keine Werbung, keine Tracker."
privacy_3_h = "Betrieb an der Universität"
privacy_3_p = "psi-pulse läuft auf Servern des Lehrstuhls, Mails gehen über die Universität. Wir geben nichts an Dritte weiter und protokollieren Zugriffe nicht dauerhaft."
privacy_4_h = "Ihre Daten, Ihre Entscheidung"
privacy_4_p = "In den Einstellungen exportieren Sie Ihre Daten oder löschen Ihr Konto. Für unsere Forschung nutzen wir Daten nur mit Ihrer ausdrücklichen Zustimmung."
privacy_link = "Datenschutzhinweise lesen"

faq_kicker = "Häufige Fragen"
faq_title = "Kurz beantwortet"
faq_1_q = "Was passiert, wenn ich eine Antwort nicht weiß?"
faq_1_a = "<p>Wählen Sie ehrlich „Nicht gewusst“. Das hat keine Folgen für Noten, es steuert nur die Wiederholung: Die Frage kommt dann nicht nach einem längeren, sondern nach demselben Abstand wieder wie zuletzt. Wissen Sie sie auch dann nicht, wird der Abstand kürzer. Eine Frage, die Sie schon beim Lesen nicht wussten, steht in der nächsten Erinnerungsmail.</p>"
faq_2_q = "Kann ich Uhrzeit und Tag der Mails ändern?"
faq_2_a = "<p>Ja, in den <a href=\"/settings\">Einstellungen</a> Ihres Kontos. Für die tägliche Erinnerung wählen Sie die Uhrzeit. Für die Wochenauswahl wählen Sie Tag, Uhrzeit und wie viele Fragen sie enthält; vorgegeben sind mittwochs sechs Fragen. Die Erinnerung kommt höchstens einmal am Tag mit bis zu sechs Fragen, und nur, wenn Fragen wieder dran sind.</p>"
faq_3_q = "Wann pausiert psi-pulse?"
faq_3_a = "<p>Wenn Sie sieben Tage nach einer Erinnerungsmail noch keine Frage aus den Erinnerungsmails beantwortet haben oder zwei Wochen lang keine Wochenauswahl zu Ende bearbeitet haben. Dann schickt psi-pulse zwei Wochen lang keine Mails und kündigt das per Mail an. Danach geht es von selbst weiter. Beantworten Sie vorher eine Ihrer Fragen, endet die Pause sofort.</p>"
faq_4_q = "Wie archiviere oder lösche ich eine Frage?"
faq_4_a = "<p>In der Web-App (bisher auf Englisch) auf der Seite „Questions“: Fragen auswählen, dann „Archive“ oder „Delete“. Beim Beantworten aus einer Mail finden Sie „Archive“ auch im Menü der Frage. Eine archivierte Frage kommt nicht mehr per Mail, Ihr Lernstand bleibt, und mit „Unarchive“ holen Sie sie zurück. Eine gelöschte Frage ist samt Lernstand weg.</p>"
faq_5_q = "Muss ich mich anmelden?"
faq_5_a = "<p>Nein. Die Selbsttests im Skript funktionieren ohne Anmeldung; Ihre Antworten bleiben dann nur in Ihrem Browser. Anmelden müssen Sie sich nur, wenn die Fragen per Mail wiederkommen sollen. Dafür genügt Ihre E-Mail-Adresse: Sie bekommen einen sechsstelligen Code, der zehn Minuten gilt; ein Passwort gibt es nicht. Danach bleiben Sie in diesem Browser 90 Tage angemeldet. Auf einer anderen Website mit psi-pulse-Fragen melden Sie sich einmal neu an.</p>"
faq_6_q = "Wie bestelle ich die Mails ab?"
faq_6_a = "<p>Über den Link unten in jeder Mail. „Keine Mails mehr von psi-pulse“ beendet Erinnerungen und Wochenauswahl, „Keine Wochenauswahl mehr“ nur die Wochenauswahl. In den <a href=\"/settings\">Einstellungen</a> schalten Sie beides wieder ein oder löschen Ihr Konto samt allen Fragen.</p>"
faq_more = "Alle Regeln im Einzelnen stehen im Abschnitt <a href=\"/entwickler/#lernlogik\">Lernlogik</a> der Seite für Entwickler."

teach_kicker = "Für Lehrende"
teach_title = "Fragen in eigene Seiten einbauen"
teach_lead = "psi-pulse-Fragen lassen sich in Webseiten einbauen, zum Beispiel in ein Skript, das Sie als HTML veröffentlichen."
teach_p = "Eine Frage schreiben Sie als gewöhnliches HTML, ein kleines Skript macht daraus den Selbsttest. Ohne JavaScript bleibt eine aufklappbare Antwort, beim Drucken erscheinen Frage und Antwort. Die Fragen übernehmen Schrift und Farben der Seite, auch in Websites aus Generatoren wie Hugo."
teach_contact = "psi-pulse steht auch Lehrenden anderer Hochschulen offen. Wir betreiben den Dienst nach bestem Bemühen, ohne Zusage zu Verfügbarkeit oder Support. Ob Sie ihn in Ihrer Lehre einsetzen dürfen, klären Sie bitte mit dem Datenschutz Ihrer Hochschule. Der Quelltext liegt offen auf <a href=\"https://github.com/UBA-PSI/psi-pulse\">GitHub</a> (AGPL-3.0), Sie können psi-pulse also auch selbst betreiben. Fragen gern an <a href=\"mailto:dh.psi@uni-bamberg.de\">dh.psi@uni-bamberg.de</a>."
