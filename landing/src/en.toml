hero_kicker = "Reading is not remembering"
hero_title = "Questions from your lecture notes, sent back by email."
hero_lead = "The lecture notes of the Chair of Privacy and Security in Information Systems (PSI) contain short self-test questions. psi-pulse sends these questions back to you by email over the following weeks, at growing intervals, so that what you read sticks."
hero_cta_how = "How it works"
hero_note = "Students of the chair find the questions in the notes of their courses."

