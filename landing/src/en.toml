demo_answer = "Answer"

problem_kicker = "The problem"
problem_title = "While reading, everything seems clear. A week later, much of it is gone."
problem_lead = "That is normal and not a sign of too little effort. Common study habits do little against it."
problem_1_h = "Forgetting is fast"
problem_1_p = "Hermann Ebbinghaus measured it in 1885: most new material can no longer be recalled after a few days. This pattern, the forgetting curve, has been confirmed many times since."
problem_2_h = "Rereading is deceptive"
problem_2_p = "When you read a text a second time, you recognise it and take that for knowing it. In a large review study, two other methods score best: testing yourself and spreading your study over weeks."
problem_3_h = "Flashcards take discipline"
problem_3_p = "Flashcard apps like Anki test you and spread the reviews over weeks. But you have to write your own cards and remember to review every day. Many people do not keep that up for long."

idea_kicker = "The idea"
idea_title = "The questions sit in the text and come back later."
idea_lead = "The researchers Andy Matuschak and Michael Nielsen call texts with embedded review questions a <em>mnemonic medium</em>: a text that helps you remember. They tried out the principle in 2019 with <a href=\"https://quantum.country/\">Quantum Country</a>, a free introduction to quantum computing with review questions built into the text."
idea_1_h = "Teachers write the questions."
idea_1_p = "You do not have to make flashcards."
idea_2_h = "The questions sit next to the material."
idea_2_p = "Right after the section you have just read, you test yourself. It takes a few seconds."
idea_3_h = "Review comes to you."
idea_3_p = "Instead of keeping track of dates yourself, you get the questions by email, at ever larger intervals."
idea_pulse = "psi-pulse brings this principle to the PSI chair’s teaching: into its lecture notes and course pages, with email reminders instead of a separate app."
idea_quote = "As a medium, books have no direct means of communicating with readers over time."
idea_quote_translation = ""
idea_quote_source = "Andy Matuschak, Michael Nielsen: <a href=\"https://numinous.productions/timeful/\"><cite lang=\"en\">Timeful Texts</cite></a> (2020)"

how_kicker = "How it works"
how_title = "Three steps, no password"
how_1_h = "Read and test yourself"
how_1_p = "The notes contain self-tests. You think, reveal the answer and say honestly whether you knew it. Without signing in, your answers are stored only in your browser."
how_2_h = "Review by email"
how_2_p = "Below an answered question, choose “Keep it and review by email”, enter your address and type in the six-digit code from the email. Your earlier answers are carried over."
how_3_h = "The questions come back"
how_3_p = "The interval grows with every answer you knew: 1, 2, 4, 7, then 14 days. If you did not know an answer, the question comes back sooner. At most one email a day with up to six questions, plus a selection on Wednesdays."
how_fineprint = "The link in the email lets you answer directly, without signing in. If you do not respond for a while, the emails pause for two weeks. You can unsubscribe via the link in every email. Your answers do not count towards any grade."

try_kicker = "Try it"
try_title = "A real psi-pulse question about this page"
try_lead = "This is what the self-tests in the lecture notes look like. Think for a moment, then reveal the answer."
try_note = "As long as you do not sign in, nothing is sent to the psi-pulse server. Your answers stay in this browser. If you sign in, these three questions will come back by email as well."
demo_q1 = "At what intervals does a question come back if you know the answer every time?"
demo_a1 = "At intervals of 1, 2, 4, 7 and 14 days. If you do not know the answer, the question comes back sooner."
demo_q2 = "What helps you remember more: reading the text again or testing yourself?"
demo_a2 = "Testing yourself. What you retrieve from memory, you keep longer than what you merely reread (testing effect, Roediger and Karpicke 2006)."
demo_q3 = "What do Andy Matuschak and Michael Nielsen call texts with embedded review questions?"
demo_a3 = "The mnemonic medium. Their example is Quantum Country, an introduction to quantum computing."

privacy_kicker = "Privacy"
privacy_title = "Only the data needed to remind you"
privacy_lead = "What psi-pulse stores depends on whether you sign in."
privacy_1_h = "Without signing in: nothing"
privacy_1_p = "Your answers stay in your browser’s storage and are not sent to us. You can delete them there yourself at any time."
privacy_2_h = "Signed in: the bare minimum"
privacy_2_p = "Your email address, a name if you like, your questions and whether you knew the answers. No passwords, no ads, no trackers."
privacy_3_h = "Run by the university"
privacy_3_p = "psi-pulse runs on the chair’s servers, and emails go through the university. We share nothing with third parties and do not keep access logs permanently."
privacy_4_h = "Your data, your choice"
privacy_4_p = "In the settings you can export your data or delete your account. We use data for our research only if you explicitly agree."
privacy_link = "Read the privacy policy (German)"

faq_kicker = "FAQ"
faq_title = "Short answers"
faq_1_q = "What happens if I don’t know an answer?"
faq_1_a = "<p>Choose “I didn’t” honestly. It has no effect on grades; it only steers the review: the question then comes back after the same interval as last time instead of a longer one. If you still don’t know it then, the interval gets shorter. A question you did not know while reading is in the next reminder email.</p>"
faq_2_q = "Can I change the time and day of the emails?"
faq_2_a = "<p>Yes, in your account’s <a href=\"/settings\">settings</a>. For the daily reminder you choose the time. For the weekly selection you choose the day, the time and how many questions it contains; the default is six questions on Wednesdays. The reminder comes at most once a day with up to six questions, and only when questions are due again.</p>"
faq_3_q = "When does psi-pulse pause?"
faq_3_a = "<p>If, seven days after a reminder email, you have not answered any question from the reminder emails, or if you have not finished any weekly selection for two weeks. psi-pulse then sends no emails for two weeks and tells you so by email. After that it resumes by itself. If you answer one of your questions before then, the pause ends at once.</p>"
faq_4_q = "How do I archive or delete a question?"
faq_4_a = "<p>In the web app, on the “Questions” page: select questions, then “Archive” or “Delete”. When answering from an email, “Archive” is also in the question’s menu. An archived question no longer comes by email, your progress is kept, and “Unarchive” brings it back. A deleted question is gone together with its progress.</p>"
faq_5_q = "Do I have to sign in?"
faq_5_a = "<p>No. The self-tests in the lecture notes work without signing in; your answers then stay in your browser only. You only need to sign in if you want the questions to come back by email. Your email address is enough: you receive a six-digit code that is valid for ten minutes; there is no password. You then stay signed in for 90 days in this browser. On another website with psi-pulse questions, you sign in once more.</p>"
faq_6_q = "How do I unsubscribe?"
faq_6_a = "<p>Via the link at the bottom of every email. “No more emails from psi-pulse” stops reminders and weekly selections, “No more weekly selections” only the weekly selection. In the <a href=\"/settings\">settings</a> you can switch both back on or delete your account with all your questions.</p>"
faq_more = "All the rules in detail are in the <a href=\"/en/developers/#lernlogik\">learning logic</a> section of the developer page."

teach_kicker = "For teachers"
teach_title = "Add questions to your own pages"
teach_lead = "psi-pulse questions can be added to web pages, for example to lecture notes you publish as HTML."
teach_p = "You write a question as plain HTML, and a small script turns it into a self-test. Without JavaScript, a collapsible answer remains; in print, question and answer both appear. The questions adopt the page’s fonts and colours, in hand-written pages as well as in sites built with generators such as Hugo."
teach_contact = "psi-pulse is open to teachers at other universities as well. We run the service on a best-effort basis, without any commitment to availability or support. Please check with your university’s data protection office whether you may use it in your teaching. Questions are welcome at <a href=\"mailto:dh.psi@uni-bamberg.de\">dh.psi@uni-bamberg.de</a>."
